# Bina laman (termasuk halaman setiap listing dari Supabase) dan terbitkan ke GitHub Pages.
# Berjalan: setiap kali ada perubahan di GitHub, setiap jam, dan bila ditekan "Run workflow".
name: Bina & terbit laman

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Jana halaman listing
        run: node scripts/build-site.mjs
        env:
          # Push (perubahan kod/kandungan): maklumkan semua URL. Jadual setiap jam: hanya yang berubah.
          INDEXNOW_ALL: ${{ github.event_name == 'push' && '1' || '0' }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - uses: actions/upload-artifact@v5
        with:
          name: indexnow
          path: |
            indexnow-urls.json
            *.txt

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: indexnow
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Maklumkan Bing melalui IndexNow
        run: node scripts/indexnow.mjs
